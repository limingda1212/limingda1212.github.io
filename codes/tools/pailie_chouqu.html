<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>物理作业随机抽查 喵~</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root{
    --seat: #d9ecff;
    --seat-b: #b8daf6;
    --hl: #ffd4d4;
    --hl-b: #ff9d9d;
    --aisle: #edf0f5;
    --ink: #24313d;
    --sub: #7b879b;
    --faint: #000000;
    --green: #1fa376;
    --row-h: clamp(24px, 6.2vw, 42px);
    --aisle-w: clamp(8px, 2.3vw, 15px);

    --white-glass: rgba(255, 255, 255, 0.78);

    --shadow-soft:  0 6px 24px rgba(120, 178, 202, 0.22);
    --shadow-hover: 0 14px 34px rgba(96, 164, 196, 0.32);
  }

  body{
    margin: 0;
    padding: 22px 13px 32px;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 72% at 50% -12%, #ffffff 0%, #f1f7fd 52%, #e8f0fa 100%);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .wrap{ max-width: 720px; margin: 0 auto; }

  /* ---------------- 返回主页圆按钮 ---------------- */
  .back-btn {
    position: fixed;
    top: 20px; right: 22px;
    z-index: 60;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--white-glass);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: var(--shadow-soft);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .back-btn:hover {
    transform: rotate(-18deg) scale(1.06);
    box-shadow: var(--shadow-hover);
  }
  .back-btn svg { width: 20px; height: 20px; }

  /* ---------- 标题 ---------- */
  .header{ text-align: center; margin: 0 0 18px; }

  /*.kicker{*/
  /*  display: inline-block;*/
  /*  font-size: 10.5px; letter-spacing: 2.4px; font-weight: 600;*/
  /*  color: #2f8a6c; background: #eaf8f2; border: 1px solid #d5ede4;*/
  /*  padding: 3px 10px; border-radius: 999px;*/
  /*}*/

  .title{
    margin: 11px 0 0;
    font-size: clamp(20px, 5.6vw, 28px);
    font-weight: 900; letter-spacing: .5px; line-height: 1.25;
    color: #1d2a37;
  }
  .title .accent{ color: var(--green); }

  .subtitle{
    margin: 9px 0 0;
    font-size: 11.5px; letter-spacing: .4px; color: var(--faint);
  }

  /* ---------- 卡片 ---------- */
  .card{
    background: rgba(255,255,255,.92);
    border: 1px solid #e8eef7;
    border-radius: 18px;
    padding: 14px 13px 16px;
    /*box-shadow: 0 16px 34px -26px rgba(28,58,102,.6), 0 3px 8px -5px rgba(28,58,102,.08);*/
  }

  .board-card{ padding: 13px 12px 12px; }

  .board-top{
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 11px;
  }

  .bt-title{
    font-size: 14px; font-weight: 700; letter-spacing: .6px; color: #3d4b5c;
    display: flex; align-items: center; gap: 6px;
  }
  .bt-title::before{
    width: 3px; height: 12px; border-radius: 2px;
  }

  .legend{ display: flex; gap: 10px; font-size: 10.5px; color: var(--sub); }
  .lg{ display: inline-flex; align-items: center; gap: 4px; }
  .sw{ width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .sw-seat{ background: var(--seat); border: 1px solid var(--seat-b); }
  .sw-hl{ background: var(--hl); border: 1px solid var(--hl-b); }

  /* ---------- 座位网格 ---------- */
  .board{
    display: grid;
    grid-template-columns: 16px repeat(2, minmax(0, 1fr)) var(--aisle-w)
                           repeat(3, minmax(0, 1fr)) var(--aisle-w)
                           repeat(4, minmax(0, 1fr));
    grid-template-rows: 15px repeat(7, var(--row-h));
    gap: 3px;
    max-width: 560px;
    margin: 0 auto;
  }

  .axis-x, .axis-y{
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 500; color: #8593a6; letter-spacing: .2px;
  }
  .axis-y{ color: #7b8a9e; }

  .aisle{ background: var(--aisle); border-radius: 5px; }

  .seat{
    background: var(--seat);
    border: 1px solid var(--seat-b);
    border-radius: 7px;
    transition: background .18s ease, border-color .18s ease, box-shadow .18s ease,
                transform .18s ease, opacity .18s ease;
  }
  .seat.dim{
    background: #f2f5f9; border-color: #e3e9f1; opacity: .55;
  }
  .seat.hl{
    background: var(--hl);
    border-color: var(--hl-b);
    box-shadow: 0 0 0 2px rgba(255, 150, 150,.22), 0 5px 12px -7px rgba(225,90,90,.85);
    transform: translateY(-1px);
  }

  .axis-note{
    display: flex; justify-content: space-between;
    max-width: 560px; margin: 9px auto 0; padding: 0 2px;
    font-size: 10px; color: var(--faint); letter-spacing: .2px;
  }

  /* ---------- 结果条 ---------- */
  .result{
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 12px 0;
    padding: 11px 14px;
    border-radius: 15px;
    background: linear-gradient(180deg, #ffffff, #f8fbfe);
    border: 1px solid #e7eef7;
    /*box-shadow: 0 10px 24px -20px rgba(28,58,102,.65);*/
  }
  .result .cell{ flex: 1 1 120px; min-width: 0; }
  .r-kicker{ font-size: 14px; letter-spacing: 1.8px; margin-bottom: 4px; }
  .r-main{
    font-size: clamp(16px, 4.6vw, 20px); font-weight: 800;
    line-height: 1.3; letter-spacing: .3px;
  }
  .r-main .num{ color: #de6070; font-size: 1.18em; padding: 0 1px; }
  .r-main.empty{ color: #b6bfcd; font-weight: 600; font-size: 20px; letter-spacing: .5px; }
  .r-meta{
    margin-left: auto; font-size: 11.5px; color: var(--sub);
    text-align: right; line-height: 1.5;
  }

  /* 弹性效果
  /*.result.pop{ animation: popIn .5s ease; }*/
  @keyframes popIn{
    0%{ transform: scale(.97); opacity: .82; }
    55%{ transform: scale(1.012); }
    100%{ transform: scale(1); opacity: 1; }
  }

  /* ---------- 抽取面板 ---------- */
  .panel-title{
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 700; letter-spacing: .6px; color: #3d4b5c;
    margin-bottom: 10px;
  }
  .panel-title::before{
    width: 3px; height: 12px; border-radius: 2px;
  }
  .panel-title .pt-right{
    margin-left: auto; font-size: 10px; font-weight: 500; color: var(--faint); letter-spacing: .2px;
  }

  .ranges{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .range{
    appearance: none; -webkit-appearance: none; font-family: inherit;
    border: 1.5px solid #e6ecf5; background: #fcfdff;
    border-radius: 14px; padding: 9px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer;
    transition: border-color .18s, background .18s, box-shadow .18s, transform .12s;
  }
  .range:active{ transform: scale(.985); }
  .range.on{
    border-color: var(--green); background: #f3fbf7;
    box-shadow: 0 10px 20px -16px rgba(31,163,118,.95);
  }
  .range .r-name{ font-size: 12px; font-weight: 700; color: #3c4a58; }
  .range.on .r-name{ color: #157a58; }
  .range .r-count{ font-size: 9.5px; color: var(--faint); letter-spacing: .1px; }

  .mini{
    display: grid;
    grid-template-columns: repeat(2, 1fr) 3px repeat(3, 1fr) 3px repeat(4, 1fr);
    gap: 2px; width: 100%; height: 11px; padding: 0 2px;
  }
  .mini i{ background: #cbe4fb; border-radius: 2px; }
  .range.on .mini i{ background: #a8d5f8; }
  .mini i.off{ background: #edf1f7; }

  .draws{ display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }

  .btn{
    appearance: none; -webkit-appearance: none; font-family: inherit;
    border: 0; border-radius: 15px; color: #fff; cursor: pointer;
    padding: 12px 8px 11px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 15px; font-weight: 800; letter-spacing: .8px;
    transition: transform .12s, filter .18s, box-shadow .18s;
  }
  .btn .b-sub{ font-size: 10px; font-weight: 500; letter-spacing: .2px; opacity: .85; }
  .btn:active{ transform: translateY(1px) scale(.99); }
  .btn-col{
    background: linear-gradient(180deg, #bbabd0, #c6abd0);
    box-shadow: 0 12px 24px -14px rgb(187 171 208 / 0.74), inset 0 1px 0 rgba(255,255,255,.34);
  }
  .btn-row{
    background: linear-gradient(180deg, #e8b7d4, #e8b7d2);
    box-shadow: 0 12px 24px -14px rgb(232 183 212 / 0.58), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn[disabled]{ filter: grayscale(.2) opacity(.72); cursor: default; transform: none; }

  .panel-foot{
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 11px; padding-top: 10px; border-top: 1px dashed #ecf1f7;
  }
  .linkbtn{
    appearance: none; border: 0; background: transparent; font-family: inherit;
    padding: 2px 0; font-size: 11.5px; color: #7b879b; cursor: pointer;
    text-decoration: underline; text-decoration-color: #d3dbe7; text-underline-offset: 3px;
  }
  .linkbtn:active{ color: var(--green); }
  .history{
    margin-left: auto; display: flex; align-items: center; gap: 5px;
    font-size: 14px; flex-wrap: wrap; justify-content: flex-end;
  }
  .hchip{
    background: #aecef6; border: 1px solid #e5ecf5; border-radius: 999px;
    padding: 2px 7px; color: #5f6d80; font-size: 10px;
  }

  .note{
    margin: 14px 4px 0; text-align: center;
    font-size: 10px; line-height: 1.7; color: #9ca8b8; letter-spacing: .2px;
  }

  @media (max-width: 400px){
    .board-top{ margin-bottom: 9px; }
    .legend{ gap: 8px; }
    .board{ grid-template-columns: 13px repeat(2, minmax(0,1fr)) var(--aisle-w)
            repeat(3, minmax(0,1fr)) var(--aisle-w) repeat(4, minmax(0,1fr)); }
    .ranges{ gap: 6px; }
    .range{ padding: 8px 4px 7px; border-radius: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
<!--    <span class="kicker">PHYSICS · 作业抽查</span>-->
    <h1 class="title">物理作业随机抽查<span class="accent">☠️</span></h1>
<!--    <p class="subtitle">班级 63 人 · 7 列 × 9 排 · 随机抽取，玩的就是刺激</p>-->
    <p class="subtitle">随机抽取，玩的就是刺激👽👽👽</p>
  </header>

  <!-- 返回主页圆按钮 --> 
  <a class="back-btn" href="../tools.html" title="返回主页" aria-label="返回主页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>

  <!-- ===== 座位排布 ===== -->
  <section class="card board-card">
    <div class="board-top">
      <span class="bt-title">座位</span>
      <div class="legend">
        <span class="lg"><i class="sw sw-seat"></i>待抽查</span>
        <span class="lg"><i class="sw sw-hl"></i>已抽中</span>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="axis-note">
      <span>排 1–9 自左向右</span>
      <span>列 1–7 自上而下</span>
    </div>
  </section>

  <!-- ===== 结果 ===== -->
  <div class="result" id="resultBar">
    <div class="cell">
      <div class="r-kicker">本次抽查</div>
      <div class="r-main empty" id="rMain">尚未抽取</div>
    </div>
    <div class="r-meta" id="rMeta">当前范围：全班</div>
  </div>

  <!-- ===== 抽取控制 ===== -->
  <section class="card">
    <div class="panel-title">
      抽取范围
      <span class="pt-right" id="seatCount">共 63 个座位</span>
    </div>

    <div class="ranges" id="ranges">
      <button class="range on" data-range="all" type="button">
        <div class="mini" data-mini="all"></div>
        <span class="r-name">全班</span>
        <span class="r-count">63 人 · 9 排</span>
      </button>
      <button class="range" data-range="left" type="button">
        <div class="mini" data-mini="left"></div>
        <span class="r-name">左侧 5 排</span>
        <span class="r-count">35 人</span>
      </button>
      <button class="range" data-range="right" type="button">
        <div class="mini" data-mini="right"></div>
        <span class="r-name">右侧 4 排</span>
        <span class="r-count">28 人</span>
      </button>
    </div>

    <div class="draws">
      <button class="btn btn-col" id="btnCol" type="button">
        抽取行
        <span class="b-sub">在范围内的排中抽一排</span>
      </button>
      <button class="btn btn-row" id="btnRow" type="button">
        抽取列
        <span class="b-sub">在 1–7 列中抽一列</span>
      </button>
    </div>

    <div class="panel-foot">
      <button class="linkbtn" id="clearBtn" type="button">清除标注</button>
      <div class="history" id="history">暂无抽取记录</div>
    </div>
  </section>
</div>

<script>
(function(){
  var ROWS = 7, SEAT_N = 9;

  var RANGES = {
    all:   { name: '全班',       seats: [1,2,3,4,5,6,7,8,9], people: 63 },
    left:  { name: '左侧 5 排',  seats: [1,2,3,4,5],         people: 35 },
    right: { name: '右侧 4 排',  seats: [6,7,8,9],           people: 28 }
  };

  var rangeKey = 'all';
  var lastDraw = null;      // { type:'col'|'row', idx:number }
  var records = [];
  var busy = false;
  var cells = [];

  // 座位序号 -> 网格列号（第 3、第 8 列是走道）
  function colOf(s){ return s <= 2 ? s + 1 : (s <= 5 ? s + 2 : s + 3); }

  function el(cls, text){
    var d = document.createElement('div');
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  /* ---------------- 构建座位网格 ---------------- */
  var board = document.getElementById('board');

  // 左上角空格
  var corner = el('');
  corner.style.gridArea = '1 / 1 / 2 / 2';
  board.appendChild(corner);

  // 排号（横向 1–9，走道位置不标数字）
  for (var s = 1; s <= SEAT_N; s++){
    var lx = el('axis-x', String(s));
    lx.style.gridArea = '1 / ' + colOf(s) + ' / 2 / ' + (colOf(s) + 1);
    board.appendChild(lx);
  }

  // 列号（纵向 1–7）
  for (var r = 1; r <= ROWS; r++){
    var ly = el('axis-y', String(r));
    ly.style.gridArea = (r + 1) + ' / 1 / ' + (r + 2) + ' / 2';
    board.appendChild(ly);
  }

  // 两条走道（浅灰通栏）
  [4, 8].forEach(function(c){
    var a = el('aisle');
    a.style.gridArea = '2 / ' + c + ' / 9 / ' + (c + 1);
    board.appendChild(a);
  });

  // 63 个座位
  for (var row = 1; row <= ROWS; row++){
    for (var seat = 1; seat <= SEAT_N; seat++){
      var c = el('seat');
      c.dataset.r = row;
      c.dataset.s = seat;
      c.style.gridArea = (row + 1) + ' / ' + colOf(seat) + ' / ' + (row + 2) + ' / ' + (colOf(seat) + 1);
      board.appendChild(c);
      cells.push(c);
    }
  }

  /* ---------------- 范围示意小图 ---------------- */
  document.querySelectorAll('.mini').forEach(function(mini){
    var key = mini.dataset.mini;
    var inRange = RANGES[key].seats;
    for (var i = 1; i <= SEAT_N; i++){
      var bar = document.createElement('i');
      bar.style.gridColumn = String(colOf(i));
      if (inRange.indexOf(i) === -1) bar.className = 'off';
      mini.appendChild(bar);
    }
  });

  /* ---------------- 渲染 ---------------- */
  function render(){
    var seats = RANGES[rangeKey].seats;
    for (var i = 0; i < cells.length; i++){
      var c = cells[i];
      var sr = parseInt(c.dataset.r, 10);
      var ss = parseInt(c.dataset.s, 10);
      var inRange = seats.indexOf(ss) !== -1;

      c.classList.toggle('dim', !inRange);

      var hl = false;
      if (lastDraw){
        hl = lastDraw.type === 'col'
          ? (sr === lastDraw.idx && inRange)
          : (ss === lastDraw.idx);
      }
      c.classList.toggle('hl', hl);
    }
  }

  function updateResult(){
    var main = document.getElementById('rMain');
    var meta = document.getElementById('rMeta');

    if (!lastDraw){
      main.className = 'r-main empty';
      main.textContent = '尚未抽取';
      meta.textContent = '当前范围：' + RANGES[rangeKey].name;
      return;
    }

    main.className = 'r-main';
    var rg = RANGES[rangeKey];
    if (lastDraw.type === 'col'){
      main.innerHTML = '第 <span class="num">' + lastDraw.idx + '</span> 排';
      meta.textContent = '抽中 ' + rg.seats.length + ' 人 · ' + rg.name;
    } else {
      main.innerHTML = '第 <span class="num">' + lastDraw.idx + '</span> 列';
      meta.textContent = '抽中 ' + ROWS + ' 人 · ' + rg.name;
    }
    document.getElementById('seatCount').textContent = '共 ' + rg.people + ' 个座位';
  }

  function renderRecords(){
    var box = document.getElementById('history');
    if (!records.length){
      box.textContent = '暂无抽取记录';
      return;
    }
    box.innerHTML = '<span>记录</span>' + records.map(function(t){
      return '<span class="hchip">' + t + '</span>';
    }).join('');
  }

  /* ---------------- 随机 ---------------- */
  function randInt(n){
    if (n <= 1) return 0;
    try {
      var buf = new Uint32Array(1);
      var limit = Math.floor(4294967296 / n) * n;
      var x;
      do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
      return x % n;
    } catch (e){
      return Math.floor(Math.random() * n);
    }
  }

  function sleep(ms){
    return new Promise(function(res){ setTimeout(res, ms); });
  }

  function lockButtons(on){
    document.getElementById('btnCol').disabled = on;
    document.getElementById('btnRow').disabled = on;
  }

  function popResult(){
    var bar = document.getElementById('resultBar');
    bar.classList.remove('pop');
    void bar.offsetWidth;
    bar.classList.add('pop');
  }

  /* ---------------- 抽取 ---------------- */
  function draw(type){
    if (busy) return;
    busy = true;
    lockButtons(true);

    var rg = RANGES[rangeKey];
    var pool = type === 'col' ? [1,2,3,4,5,6,7] : rg.seats.slice();
    var finalIdx = pool[randInt(pool.length)];   // 先定结果，再做滚动动画

    var steps = 11;
    (async function(){
      for (var i = 0; i < steps; i++){
        var tmp = pool[randInt(pool.length)];
        lastDraw = { type: type, idx: tmp };
        render();
        await sleep(i < steps - 4 ? 55 : 110);
      }

      lastDraw = { type: type, idx: finalIdx };
      render();
      updateResult();
      popResult();

      records.push((type === 'col' ? '排 ' : '列 ') + finalIdx);
      if (records.length > 3) records.shift();
      renderRecords();

      busy = false;
      lockButtons(false);
    })();
  }

  /* ---------------- 交互 ---------------- */
  document.getElementById('ranges').addEventListener('click', function(e){
    var btn = e.target.closest('.range');
    if (!btn || busy) return;
    rangeKey = btn.dataset.range;
    lastDraw = null;
    document.querySelectorAll('.range').forEach(function(b){
      b.classList.toggle('on', b.dataset.range === rangeKey);
    });
    render();
    updateResult();
  });

  document.getElementById('btnCol').addEventListener('click', function(){ draw('col'); });
  document.getElementById('btnRow').addEventListener('click', function(){ draw('row'); });

  document.getElementById('clearBtn').addEventListener('click', function(){
    if (busy) return;
    lastDraw = null;
    render();
    updateResult();
  });

  /* ---------------- 初始化 ---------------- */
  render();
  updateResult();
  renderRecords();
})();
</script>
</body>
</html>
