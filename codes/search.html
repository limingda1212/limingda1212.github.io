<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>搜索聚合</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="search-page" style="background-image:url('../photos/search_bg.jpeg')">

  <!-- 返回主页圆按钮 -->
  <a class="back-btn" href="../index.html" title="返回主页" aria-label="返回主页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>

  <div class="search-wrap">
    <!-- 引擎选择 + 搜索框 -->
    <div class="search-panel">
      <select id="engine" title="选择搜索引擎"></select>
      <input id="q" type="text" placeholder="输入关键词，回车或点击搜索…" autocomplete="off" />
      <button id="searchBtn">搜索</button>
    </div>

    <!-- 常用网站小圆框 -->
    <h2 class="quick-title">常去的网站</h2>
    <div class="quick-sites" id="quickSites"></div>
  </div>

  <footer class="site-footer">
    <p><span class="dot"></span><span id="uptime">正在计时…</span></p>
    <p>© <span id="year"></span> limingda1212</p>
  </footer>

  <script src="search.js"></script>
</body>
</html>
