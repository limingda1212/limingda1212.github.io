<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Limnda个人主页：关于我、资源、留言、搜索聚合。" />
  <title>Limnda · 个人主页</title>
  <link rel="stylesheet" href="codes/style.css" />
</head>
<body>

  <!-- ========== 顶部：全屏背景 + 圆形头像 + 名字 + 社交小圆框 ========== -->
  <header class="hero">
    <div class="hero-bg" style="background-image:url('photos/bg.jpg')"></div>
    <div class="hero-content">
      <div class="avatar-frame">
        <img src="photos/avatar.jpeg" alt="头像" />
      </div>
      <h1 class="site-name">Limnda</h1>
      <!-- 签名 -->
      <p class="site-sub">记录生活的一点一滴</p>
      <div class="socials" id="socials"></div>
    </div>
    <!-- 底部波浪，衔接下半部分的卡片区 -->
    <svg class="hero-wave" viewBox="0 0 1440 110" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,58 C180,104 380,22 620,50 C860,78 1120,110 1440,56 L1440,110 L0,110 Z" fill="#f3fafd"></path>
    </svg>
  </header>

  <!-- ========== 下半部分：六个功能卡 ========== -->
  <main class="cards-section">
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <!-- ========== 站尾：运行计时 ========== -->
  <footer class="site-footer">
    <p><span class="dot"></span><span id="uptime">网站已运行</span></p>
    <p>© <span id="year"></span> limingda1212 · Powered by GitHub Pages</p>
  </footer>

  <script src="codes/main.js"></script>
</body>
</html>
